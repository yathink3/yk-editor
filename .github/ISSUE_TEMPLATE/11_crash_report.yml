name: Report a crash
description: YK Editor is crashing or freezing or hanging.
type: Crash
labels: "state:needs triage"
body:
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the crash from a **clean YK Editor install**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start YK Editor
        2. Perform an action
        3. YK Editor crashes
    validations:
      required: true
  - type: textarea
    attributes:
      label: YK Editor version and system specs
      description: |
        Open the command palette in YK Editor, then type “yk-editor: copy system specs into clipboard”.
      placeholder: |
        YK Editor: v1.0.8
        OS: macOS 15.1
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attach YK Editor log file
      description: |
        Open the command palette in YK Editor, then type `yk-editor: open log` to see the last 1000 lines. Or type `yk-editor: reveal log in file manager` in the command palette to reveal the log file itself.

        ⚠️ **Please review your log file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>YK-Editor.log</summary>

        <!-- Paste your log inside the code block. -->
        ```log

        ```

        </details>
    validations:
      required: false
